services:
  api:
    build:
      context: .
      target: runtime
    image: gofrench-quiz
    init: true
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"

  dev:
    build:
      context: .
      target: dev
    image: gofrench-quiz:dev
    profiles: [dev]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - /app/node_modules
